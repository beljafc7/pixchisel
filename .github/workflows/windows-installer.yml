name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build Windows x64 NSIS installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Verify version metadata
        run: npm run version:check

      - name: Run frontend tests
        run: npm test

      - name: Run native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis --ci

      - name: Read application version
        id: app-version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: pixchisel-${{ steps.app-version.outputs.version }}-windows-x64-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
