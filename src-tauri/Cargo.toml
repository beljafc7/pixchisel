[package]
name = "pixchisel"
version = "0.3.0"
description = "A private, local image conversion and optimization utility"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pixchisel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
color_quant = "2.0.0"
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
oxipng = { version = "10.2.0", default-features = false }
png = "0.18.1"
libwebp-sys = "0.9.6"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package.libwebp-sys]
opt-level = 3
